<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | ⚡ Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #0f0f1a;
      color: #eaeaf2;
    }
    label.form-label, .form-check-label { color: #ffffff !important; }
    .card {
      background: #1a1a2e;
      border: 1px solid rgba(124, 58, 237, 0.35);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      border-radius: 16px;
    }
    .accent {
      color: #7c3aed;
    }
    .form-control, .form-select {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.10);
      color: #eaeaf2;
    }
    .form-control:focus {
      background: rgba(255,255,255,0.04);
      border-color: rgba(124, 58, 237, 0.8);
      box-shadow: 0 0 0 0.2rem rgba(124, 58, 237, 0.25);
      color: #eaeaf2;
    }
    .btn-accent {
      background: #7c3aed;
      border: none;
    }
    .btn-accent:hover {
      background: #6d28d9;
    }
    .link-accent { color: #7c3aed; text-decoration: none; }
    .text-center.mt-3.small .text-muted { color: #ffffff !important; }
    .text-muted { color: #ffffff !important; }
    .link-accent:hover { color: #a78bfa; text-decoration: underline; }
    .form-text.text-muted { color: #ffffff !important; }
    .form-check-label { color: #ffffff !important; }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="text-center mb-4">
        <div class="display-6 fw-bold accent">⚡ Admin Panel</div>
        <div class="text-muted small">Sign in to continue</div>
      </div>

      <div class="card p-4 p-md-5">

        <div th:if="${param.error}" class="alert alert-danger border-0" role="alert">
          Invalid username or password
        </div>

        <div th:if="${param.logout}" class="alert alert-success border-0" role="alert">
          Logged out successfully
        </div>

        <form th:action="@{/login}" method="post" class="mt-2">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input id="username" name="username" type="text" class="form-control" autocomplete="username" required />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required />
              <button class="btn btn-outline-light" type="button" id="togglePassword">Show</button>
            </div>
            <div class="form-text text-muted">Use your account password.</div>
          </div>

          <div class="d-flex align-items-center justify-content-between mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" name="remember-me" />
              <label class="form-check-label" for="rememberMe">Remember me</label>
            </div>
          </div>

          <button type="submit" class="btn btn-accent w-100 py-2 fw-semibold">Login</button>

          <div class="text-center mt-3 small">
            <span class="text-muted">New here? </span>
            <a class="link-accent" th:href="@{/signup}">Create an account</a>
          </div>
        </form>
      </div>

      <div class="text-center text-muted small mt-3">
        © <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"/> ⚡ Admin Panel
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    const toggle = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    if (!toggle || !password) return;

    toggle.addEventListener('click', function () {
      const isPassword = password.type === 'password';
      password.type = isPassword ? 'text' : 'password';
      toggle.textContent = isPassword ? 'Hide' : 'Show';
    });
  })();
</script>

</body>
</html>
