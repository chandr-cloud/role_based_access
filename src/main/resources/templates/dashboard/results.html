<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Results | ⚡ Admin Panel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <style>
    body { background: #0f0f1a; color: #eaeaf2; }
    .bb-wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }

    .bb-card {
      background: rgba(26,26,46,1);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 16px;
    }

    .bb-table {
      width: 100%;
      color: rgba(255,255,255,0.8);
    }

    .bb-table thead th {
      border-bottom: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.75);
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.2px;
      padding-top: 12px;
      padding-bottom: 12px;
      white-space: nowrap;
    }

    .bb-table tbody td {
      padding-top: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      vertical-align: middle;
      white-space: nowrap;
    }

    .bb-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: rgba(124, 58, 237, 0.3);
      color: #ffffff;
    }

    .bb-pill-active { background: rgba(52,211,153,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.25); }
    .bb-pill-upcoming { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.25); }
    .bb-pill-closed { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.25); }


    .bb-actions a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 900;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 10px;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
    }

    .bb-actions a:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.2); }

    .bb-muted { color: rgba(255,255,255,0.55) !important; font-weight: 700; }

    .bb-error {
      display: none;
      border-radius: 12px;
      border: 1px solid rgba(239,68,68,0.35);
      background: rgba(239,68,68,0.12);
      padding: 12px 14px;
      color: #fecaca;
      font-weight: 800;
    }

    .bb-hint { color: rgba(255,255,255,0.55) !important; font-weight: 700; }
  </style>
</head>
<body>
<div class="bb-wrap">
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
    <div>
      <h3 class="fw-bold mb-1">Results</h3>
      <div class="bb-muted">Scaffold + JS integration using <code>/api/v1/results/search</code></div>
    </div>
  </div>

  <div class="bb-card mb-3">
    <div class="row g-2">
      <div class="col-12 col-md-3">
        <label class="form-label mb-1">Job ID (optional)</label>
        <input id="jobId" class="form-control" type="number" min="1" placeholder="e.g. 1" />
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label mb-1">Status (optional)</label>
        <select id="status" class="form-select">
          <option value="">All</option>
          <option value="PUBLISHED">PUBLISHED</option>
          <option value="DRAFT">DRAFT</option>
          <option value="EXPIRED">EXPIRED</option>
          <option value="CANCELLED">CANCELLED</option>
        </select>
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label mb-1">From (created date)</label>
        <input id="from" class="form-control" type="date" />
      </div>

      <div class="col-12 col-md-3">
        <label class="form-label mb-1">To (created date)</label>
        <input id="to" class="form-control" type="date" />
      </div>

      <div class="col-12 col-md-4">
        <button type="button" class="btn" style="background:#7c3aed;color:#fff;font-weight:900;border-radius:12px;padding:10px 14px;width:100%;" onclick="loadResults(0)">
          <i class="bi bi-search me-2"></i>Search
        </button>
      </div>

      <div class="col-12 col-md-4">
        <button type="button" class="btn" style="border:1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); color:#fff; font-weight:900; border-radius:12px; padding:10px 14px;width:100%;" onclick="resetFilters()">
          <i class="bi bi-arrow-counterclockwise me-2"></i>Reset
        </button>
      </div>

      <div class="col-12 col-md-4">
        <button type="button" class="btn" style="border:1px solid rgba(124,58,237,0.65); background: rgba(124,58,237,0.08); color:#fff; font-weight:900; border-radius:12px; padding:10px 14px;width:100%;" onclick="refreshCurrentPage()">
          <i class="bi bi-arrow-repeat me-2"></i>Refresh
        </button>
      </div>

      <div class="col-12">
        <div id="bbError" class="bb-error"></div>
      </div>
    </div>
  </div>

  <div class="bb-card">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
      <div class="fw-bold" style="font-size:18px;">Results List</div>
      <div class="bb-hint" id="bbHint">Loading...</div>
    </div>

    <div class="table-responsive">
      <table class="table bb-table align-middle">
        <thead>
        <tr>
          <th style="width:70px;">#</th>
          <th>Job Title</th>
          <th>Created Date</th>
          <th>Status</th>
          <th style="width:220px;">Actions</th>
        </tr>
        </thead>
        <tbody id="resultsTbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/results.js"></script>
</body>
</html>
