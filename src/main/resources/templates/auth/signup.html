<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signup | ⚡ Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #0f0f1a;
      color: #eaeaf2;
    }
    label.form-label { color: #ffffff !important; }
    .card {
      background: #1a1a2e;
      border: 1px solid rgba(124, 58, 237, 0.35);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      border-radius: 16px;
    }
    .accent { color: #7c3aed; }
    .form-control {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.10);
      color: #eaeaf2;
    }
    .form-control:focus {
      background: rgba(255,255,255,0.04);
      border-color: rgba(124, 58, 237, 0.8);
      box-shadow: 0 0 0 0.2rem rgba(124, 58, 237, 0.25);
      color: #eaeaf2;
    }
    .btn-accent {
      background: #7c3aed;
      border: none;
    }
    .btn-accent:hover {
      background: #6d28d9;
    }
    .link-accent { color: #7c3aed; text-decoration: none; }
    .link-accent:hover { color: #a78bfa; text-decoration: underline; }
    .small-hint { color: #ffffff !important; }
    .text-center small .text-muted,
    .text-muted { color: #ffffff !important; }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-6">
      <div class="text-center mb-4">
        <div class="display-6 fw-bold accent">⚡ Admin Panel</div>
        <div class="text-muted small">Create your account</div>
      </div>

      <div class="card p-4 p-md-5">




        <div th:if="${successMessage}" class="alert alert-success border-0" role="alert">
          <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger border-0" role="alert">
          <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/public/signup}" method="post" id="signupForm" onsubmit="return validatePasswords()">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <div class="row g-3">
            <div class="col-12">
              <label for="fullName" class="form-label">Full Name</label>
              <input id="fullName" name="fullName" type="text" class="form-control" autocomplete="name" required />
            </div>

            <div class="col-12">
              <label for="username" class="form-label">Username</label>
              <input id="username" name="username" type="text" class="form-control" autocomplete="username" required />
            </div>

            <div class="col-12">
              <label for="email" class="form-label">Email</label>
              <input id="email" name="email" type="email" class="form-control" autocomplete="email" required />
            </div>

            <div class="col-12 col-md-6">
              <label for="password" class="form-label">Password</label>
              <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" required />
            </div>

            <div class="col-12 col-md-6">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" autocomplete="new-password" required />
            </div>

            <div class="col-12">
              <div id="passwordMismatch" class="alert alert-danger border-0 d-none" role="alert"></div>
              <div class="small-hint small mt-1">Passwords must match before you submit.</div>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-accent w-100 py-2 fw-semibold">Create account</button>
            </div>

            <div class="col-12 text-center small mt-1">
              <span class="text-muted">Already have an account? </span>
              <a class="link-accent" th:href="@{/login}">Go to login</a>
            </div>
          </div>
        </form>
      </div>

      <div class="text-center text-muted small mt-3">
        © <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"/> ⚡ Admin Panel
      </div>
    </div>
  </div>
</div>

<script>
  function validatePasswords() {
    const form = document.getElementById('signupForm');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const mismatch = document.getElementById('passwordMismatch');

    if (!password || !confirmPassword || !mismatch) return true;

    const p = password.value;
    const cp = confirmPassword.value;

    if (p !== cp) {
      mismatch.textContent = 'Passwords do not match. Please re-check.';
      mismatch.classList.remove('d-none');
      if (form) form.querySelector('button[type="submit"]').disabled = false;
      confirmPassword.focus();
      return false;
    }

    mismatch.classList.add('d-none');
    return true;
  }

  (function () {
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');

    // Only move focus when the user is typing in confirmPassword.
    // This prevents cursor from jumping while editing the password field.
    confirmPassword && confirmPassword.addEventListener('input', function () {
      validatePasswords();
    });

    password && password.addEventListener('input', function () {
      const form = document.getElementById('signupForm');
      const mismatch = document.getElementById('passwordMismatch');
      if (!mismatch) return;

      if (password.value !== confirmPassword.value) {
        mismatch.textContent = 'Passwords do not match. Please re-check.';
        mismatch.classList.remove('d-none');
        if (form) {
          const submitBtn = form.querySelector('button[type="submit"]');
          if (submitBtn) submitBtn.disabled = false;
        }
      } else {
        mismatch.classList.add('d-none');
      }
    });
  })();
</script>

</body>
</html>
