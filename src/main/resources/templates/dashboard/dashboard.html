<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard | ⚡ Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #0f0f1a; color: #eaeaf2; }
    .sidebar {
      background: #111125;
      border-right: 1px solid rgba(124, 58, 237, 0.25);
      min-height: 100vh;
    }
    .brand {
      color: #7c3aed;
      font-weight: 800;
      letter-spacing: 0.2px;
    }
    .nav-link {
      color: rgba(234, 234, 242, 0.85);
    }
    .nav-link:hover { color: #fff; }
    .nav-link.active {
      background: rgba(124, 58, 237, 0.18);
      color: #fff;
      border-left: 3px solid #7c3aed;
      padding-left: 17px;
    }
    .topbar {
      background: #0f0f1a;
      border-bottom: 1px solid rgba(124, 58, 237, 0.25);
    }
    .card {
      background: #1a1a2e;
      border: 1px solid rgba(124, 58, 237, 0.30);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .btn-accent { background: #7c3aed; border: none; }
    .btn-accent:hover { background: #6d28d9; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row g-0">

    <nav class="col-12 col-md-3 col-lg-2 sidebar px-3 py-4">
      <div class="mb-4">
        <div class="brand fs-4">⚡ Admin Panel</div>
        <div class="text-muted small">Admin console</div>
      </div>

      <div class="nav flex-column nav-pills" id="sideNav" role="navigation" aria-label="Main navigation">
        <a class="nav-link active mb-2" th:href="@{/dashboard}">Dashboard</a>
        <a class="nav-link mb-2" th:href="@{/jobs}">Jobs</a>
        <a class="nav-link mb-2" th:href="@{/users}">Users</a>
        <a class="nav-link" th:href="@{/settings}">Settings</a>
      </div>
    </nav>

    <main class="col-12 col-md-9 col-lg-10">

      <div class="topbar sticky-top" style="z-index: 1020;">
        <div class="d-flex align-items-center justify-content-between px-3 py-3">
          <div>
            <div class="fw-semibold">Dashboard</div>
            <div class="text-muted small">Overview & quick actions</div>
          </div>

          <div class="d-flex align-items-center gap-3">
            <div class="text-end">
              <div class="text-muted small">Signed in as</div>
              <div class="fw-semibold" sec:authentication="name">user</div>
            </div>

            <form th:action="@{/logout}" method="post" class="m-0">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button class="btn btn-outline-light" type="submit">Logout</button>
            </form>
          </div>
        </div>
      </div>

      <div class="p-3 p-md-4">

        <div class="card p-4 mb-4">
          <div class="fs-5 fw-semibold">
            Welcome back, <span sec:authentication="name">username</span>!
          </div>
          <div class="text-muted mt-1">Here’s what’s happening today.</div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card p-4 h-100">
              <div class="text-muted small">Total Jobs</div>
              <div class="display-6 fw-bold">124</div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card p-4 h-100">
              <div class="text-muted small">Active Jobs</div>
              <div class="display-6 fw-bold">58</div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card p-4 h-100">
              <div class="text-muted small">Applications</div>
              <div class="display-6 fw-bold">932</div>
            </div>
          </div>
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card p-4 h-100">
              <div class="text-muted small">Users</div>
              <div class="display-6 fw-bold">76</div>
            </div>
          </div>
        </div>

      </div>
    </main>

  </div>
</div>
</body>
</html>
